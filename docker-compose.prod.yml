# docker-compose.prod.yml
# Used on the production server — pulls pre-built images from GHCR
# instead of building from source.

services:

  redis:
    image: redis:7-alpine
    container_name: seo_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  backend:
    image: ghcr.io/jinadhiwijesooriya/seo-backend:latest
    container_name: seo_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/storage/seo_platform.db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=true
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - TZ=UTC
    volumes:
      - backend_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  celery_worker:
    image: ghcr.io/jinadhiwijesooriya/seo-backend:latest
    container_name: seo_celery_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/storage/seo_platform.db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=true
      - TZ=UTC
    volumes:
      - backend_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  celery_beat:
    image: ghcr.io/jinadhiwijesooriya/seo-backend:latest
    container_name: seo_celery_beat
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/storage/seo_platform.db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=true
      - TZ=UTC
    volumes:
      - backend_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  frontend:
    image: ghcr.io/jinadhiwijesooriya/seo-frontend:latest
    container_name: seo_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  redis_data:
  backend_storage:
